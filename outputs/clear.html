<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Refreshing Gohar's Lab</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #fbf5ef;
        color: #26231f;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(28rem, calc(100% - 2rem));
        text-align: center;
      }
      a {
        color: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Refreshing Gohar's Lab</h1>
      <p>Please wait a moment. If the site does not open automatically, use this link:</p>
      <p><a href="/">Open Gohar's Lab</a></p>
    </main>
    <script>
      (function () {
        try {
          localStorage.clear();
          sessionStorage.clear();
        } catch (error) {}

        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations()
            .then(function (registrations) {
              return Promise.all(registrations.map(function (registration) {
                return registration.unregister();
              }));
            })
            .catch(function () {})
            .then(function () {
              window.location.replace("/?fresh=" + Date.now());
            });
        } else {
          window.location.replace("/?fresh=" + Date.now());
        }
      })();
    </script>
  </body>
</html>
